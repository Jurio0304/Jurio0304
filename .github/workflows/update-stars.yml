name: Update GitHub Activity

on:
  schedule:
    # 09:17 Asia/Shanghai on the 1st, 11th and 21st.
    - cron: '17 1 1,11,21 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-stars.yml
      - scripts/sample-stars.py
      - scripts/render-star-history.py

permissions:
  contents: write

concurrency:
  group: profile-star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install renderer
        run: python -m pip install matplotlib==3.8.0 'numpy<2'

      - name: Sample and render
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/sample-stars.py "$GITHUB_REPOSITORY_OWNER" data/star-history.json
          python scripts/render-star-history.py data/star-history.json github-stars.png

      - name: Publish updated chart
        run: |
          git add data/star-history.json github-stars.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update GitHub Activity star history'
          git pull --rebase origin main
          git push origin HEAD:main
